<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Heart Disease Prediction</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 22px; }
  form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
  label { display: flex; flex-direction: column; font-size: 13px; color: #333; }
  input, select { padding: 6px; margin-top: 4px; font-size: 14px; }
  button { grid-column: 1 / -1; padding: 10px; font-size: 15px; margin-top: 8px; cursor: pointer; }
  #result { margin-top: 20px; padding: 14px; border-radius: 6px; font-size: 16px; display: none; }
  #result.detected { background: #fdecea; color: #611a15; }
  #result.clear { background: #eafaf0; color: #14532d; }
  #error { margin-top: 12px; color: #b91c1c; display: none; }
</style>
</head>
<body>
  <h1>Heart Disease Risk Prediction</h1>
  <p>Enter patient clinical parameters and click Predict.</p>

  <form id="predictForm">
    <label>Age
      <input type="number" name="age" value="63" required>
    </label>
    <label>Sex (1=Male, 0=Female)
      <select name="sex">
        <option value="1">Male</option>
        <option value="0">Female</option>
      </select>
    </label>
    <label>Chest Pain Type (cp: 0-3)
      <input type="number" name="cp" min="0" max="3" value="3" required>
    </label>
    <label>Resting BP (trestbps)
      <input type="number" name="trestbps" value="145" required>
    </label>
    <label>Cholesterol (chol)
      <input type="number" name="chol" value="233" required>
    </label>
    <label>Fasting Blood Sugar &gt;120 (fbs)
      <select name="fbs">
        <option value="1">Yes</option>
        <option value="0">No</option>
      </select>
    </label>
    <label>Resting ECG (restecg: 0-2)
      <input type="number" name="restecg" min="0" max="2" value="0" required>
    </label>
    <label>Max Heart Rate (thalach)
      <input type="number" name="thalach" value="150" required>
    </label>
    <label>Exercise Angina (exang)
      <select name="exang">
        <option value="0">No</option>
        <option value="1">Yes</option>
      </select>
    </label>
    <label>ST Depression (oldpeak)
      <input type="number" step="0.1" name="oldpeak" value="2.3" required>
    </label>
    <label>Slope (0-2)
      <input type="number" name="slope" min="0" max="2" value="0" required>
    </label>
    <label>Major Vessels (ca: 0-4)
      <input type="number" name="ca" min="0" max="4" value="0" required>
    </label>
    <label>Thalassemia (thal: 0-3)
      <input type="number" name="thal" min="0" max="3" value="1" required>
    </label>
    <button type="submit">Predict</button>
  </form>

  <div id="result"></div>
  <div id="error"></div>

  <script>
    const form = document.getElementById("predictForm");
    const resultDiv = document.getElementById("result");
    const errorDiv = document.getElementById("error");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      resultDiv.style.display = "none";
      errorDiv.style.display = "none";

      const formData = new FormData(form);
      const payload = {};
      for (const [key, value] of formData.entries()) {
        payload[key] = parseFloat(value);
      }

      try {
        const response = await fetch("/predict", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const data = await response.json();

        if (!response.ok) {
          errorDiv.textContent = data.error || "Something went wrong.";
          errorDiv.style.display = "block";
          return;
        }

        resultDiv.className = data.prediction.startsWith("Heart Disease Detected") ? "detected" : "clear";
        resultDiv.textContent = `${data.prediction} (probability: ${data.probability})`;
        resultDiv.style.display = "block";
      } catch (err) {
        errorDiv.textContent = "Could not reach the prediction service.";
        errorDiv.style.display = "block";
      }
    });
  </script>
</body>
</html>
